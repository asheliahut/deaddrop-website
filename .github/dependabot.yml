version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    # Let new releases age a few days before proposing them.
    cooldown:
      default-days: 3
      semver-major-days: 7
    commit-message:
      prefix: "deps"
    groups:
      # All minor and patch bumps in one PR.
      npm-minor-patch:
        update-types: [minor, patch]
      # Major bumps grouped separately since they may need code changes.
      npm-major:
        update-types: [major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
    commit-message:
      prefix: "ci"
    groups:
      # Every action bump in one PR, so actions.lock is regenerated once.
      github-actions:
        patterns: ["*"]
